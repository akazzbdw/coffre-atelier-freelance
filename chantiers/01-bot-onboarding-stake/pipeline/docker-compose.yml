# Bots d'accompagnement Stake (chantier 01 de l'atelier freelance).
# V1.1 (appel Sofiane du 2026-09-19) : UN BOT PAR INFLUENCEUR — même code,
# même image, un conteneur par influenceur avec son jeton, son lien de
# parrainage et sa propre base de progression. Secrets dans .env.jd et
# .env.clive (modèle : .env.example), jamais commités.
# Mise en ligne : la fiche du 09 (02-Projets/09-atelier-freelance/projet.toml) déclare ce compose,
# le veilleur, l'installeur et la sauvegarde la lisent — pousser suffit.
# Noms Docker (2026-09-20) : projet `labo-09-stake`, volumes `labo-09-stake-jd` / `labo-09-stake-clive`
# (avant : projet « pipeline », le même que le bot 05 — un `down --remove-orphans` ici l'aurait tué).
name: labo-09-stake

# L'ancre ne porte que ce qui est vraiment commun. Les `volumes` n'y sont PAS
# (audit ops 2026-09-20) : la fusion YAML `<<` ne concatène pas les listes, la
# clé `volumes:` d'un service REMPLACE celle de l'ancre — les montages écrits
# ici étaient morts, seuls ceux du service comptaient. Chaque service écrit donc
# ses trois montages, explicitement.
x-bot: &bot
  build:
    context: ..
    dockerfile: pipeline/Dockerfile
    args:
      LABO_FUSEAU: ${LABO_FUSEAU:-Europe/Zurich}
      # 00-Systeme/versions.env (exporté par autodeploy.sh / installer-vps.sh)
      PTB_VERSION: ${PTB_VERSION:?exporte 00-Systeme/versions.env}
  image: labo/bot-onboarding-stake
  restart: unless-stopped

services:
  bot-jd:
    <<: *bot
    container_name: bot-stake-jd
    env_file: /home/ubuntu/labo-secrets/09-stake-jd.env   # hors dépôt (audit 2026-09-22)
    volumes:
      # montage MINIMAL : la boîte noire, rien d'autre — ce bot n'a aucune
      # raison de voir le reste du Labo (il sert des inconnus).
      # 01-Vault en écriture : c'est LÀ que labo_trace écrit la base
      # (01-Vault/labo-vps.db). Sans ce montage, les traces s'écrivaient dans
      # la couche éphémère du conteneur et mouraient à chaque redéploiement —
      # y compris la trace d'échec de démarrage (contre-audit 2026-09-17).
      - bot-stake-jd:/data
      - ${LABO_VPS_REPO:-/home/ubuntu/labo-repo}/00-Systeme:/labo-repo/00-Systeme:ro
      - ${LABO_VPS_REPO:-/home/ubuntu/labo-repo}/01-Vault:/labo-repo/01-Vault
  bot-clive:
    <<: *bot
    container_name: bot-stake-clive
    env_file: /home/ubuntu/labo-secrets/09-stake-clive.env   # hors dépôt (audit 2026-09-22)
    volumes:
      - bot-stake-clive:/data
      - ${LABO_VPS_REPO:-/home/ubuntu/labo-repo}/00-Systeme:/labo-repo/00-Systeme:ro
      - ${LABO_VPS_REPO:-/home/ubuntu/labo-repo}/01-Vault:/labo-repo/01-Vault

volumes:
  bot-stake-jd:
    name: labo-09-stake-jd
  bot-stake-clive:
    name: labo-09-stake-clive
